{% extends "admin/base_site.html" %}
{% block content %}
<div id="content-main">
  <h1>{{ title }}</h1>
  <p><a href="{% url 'admin:catalog_product_change' product.pk %}">{{ product }}</a></p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row"><input type="submit" value="Save" class="default"></div>
  </form>
</div>
{% endblock %}
